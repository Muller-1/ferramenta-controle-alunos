name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v

  deb:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: bash packaging/build-deb.sh
      - name: Instalar o pacote e testar
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/lab-painel_*_all.deb
          lab 2>&1 | head -3
          lab-painel lab | grep -q "uso: lab-painel"
          test -x /usr/lib/lab-painel/labpainel/pcs/lab-ferramentas-mint.sh
          for f in /usr/share/lab-painel/pcs/*.sh /usr/lib/lab-painel/labpainel/pcs/*.sh; do bash -n "$f"; done
          sudo apt-get install -y xvfb
          # o painel deve ficar aberto até o timeout (124); qualquer outro código = quebrou
          rc=0
          LAB_PAINEL_DEMO=1 LAB_PAINEL_CONFIG="$RUNNER_TEMP/c.json" xvfb-run -a timeout 6 lab-painel || rc=$?
          test "$rc" -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pyinstaller==6.11.1
      - name: Gerar o .exe
        run: pyinstaller --onefile --windowed --name LabPainel --add-data "pcs/lab-ferramentas-mint.sh;labpainel/pcs" run_painel.py
      - name: Abrir o programa por alguns segundos (teste de fumaça)
        shell: pwsh
        run: |
          $env:LAB_PAINEL_DEMO = "1"
          $env:LAB_PAINEL_CONFIG = Join-Path $env:RUNNER_TEMP "c.json"
          $p = Start-Process -FilePath dist\LabPainel.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "LabPainel.exe fechou sozinho (código $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
      - name: Montar o zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path pacote | Out-Null
          Copy-Item dist\LabPainel.exe, README.md, LICENSE pacote\
          Compress-Archive -Path pacote\* -DestinationPath LabPainel-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: LabPainel-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artefatos/*.deb
            artefatos/*.zip
          generate_release_notes: true
